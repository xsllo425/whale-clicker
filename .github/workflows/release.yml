name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install sv-ttk pyinstaller pillow
      - name: Self-test (headless)
        env:
          WHALE_HEADLESS: "1"
        run: python tests/test_basic.py
      - name: Build exe
        shell: pwsh
        run: ./build.ps1 -Py python
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: 鲸鱼连点器 ${{ github.ref_name }}
          files: dist/鲸鱼连点器.exe
          body_path: CHANGELOG.md